<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prakhar Bridge Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f5f2ea;
    --surface:#ffffff;
    --surface-2:#eee8da;
    --ink:#201d17;
    --ink-soft:#665f4f;
    --ink-faint:#948c78;
    --border:#ddd4bd;
    --accent:#1f6f6e;
    --accent-ink:#0f4d4c;
    --accent-soft:#dcefee;
    --good-bg:#e5f3e8; --good-ink:#2f7d46;
    --warn-bg:#f6ecd7; --warn-ink:#a3711f;
    --bad-bg:#fbe6e1;  --bad-ink:#b23b2a;
    --cat0-bg:#f1e6f2; --cat0-ink:#7c3f83;
    --cat1-bg:#e6e9f7; --cat1-ink:#45529c;
    --cat2-bg:#e3eef4; --cat2-ink:#2f6a8a;
    --cat3-bg:#f5ecd9; --cat3-ink:#8f6b1a;
    --cat4-bg:#f6e4e3; --cat4-ink:#a94a52;
    --cat5-bg:#e7ebee; --cat5-ink:#495a6b;
    --shadow: 0 1px 2px rgba(32,29,23,.06), 0 8px 24px -12px rgba(32,29,23,.18);
    --font-display:'Fraunces', ui-serif, Georgia, serif;
    --font-ui:'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#13181a;
      --surface:#1a2123;
      --surface-2:#212a2c;
      --ink:#eef1ee;
      --ink-soft:#a3b0ac;
      --ink-faint:#6d7a76;
      --border:#2b3537;
      --accent:#6fe0d6;
      --accent-ink:#9cf0e8;
      --accent-soft:#1c3634;
      --good-bg:#1f3327; --good-ink:#7fd99a;
      --warn-bg:#3d2f16; --warn-ink:#eac877;
      --bad-bg:#3d201a;  --bad-ink:#f08a72;
      --cat0-bg:#3a2740; --cat0-ink:#e3b8ea;
      --cat1-bg:#29304f; --cat1-ink:#b9c2f2;
      --cat2-bg:#1f3540; --cat2-ink:#8fd0ef;
      --cat3-bg:#423318; --cat3-ink:#e0bd6a;
      --cat4-bg:#402626; --cat4-ink:#eb9a9f;
      --cat5-bg:#2a333c; --cat5-ink:#b6c4d1;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13181a;
    --surface:#1a2123;
    --surface-2:#212a2c;
    --ink:#eef1ee;
    --ink-soft:#a3b0ac;
    --ink-faint:#6d7a76;
    --border:#2b3537;
    --accent:#6fe0d6;
    --accent-ink:#9cf0e8;
    --accent-soft:#1c3634;
    --good-bg:#1f3327; --good-ink:#7fd99a;
    --warn-bg:#3d2f16; --warn-ink:#eac877;
    --bad-bg:#3d201a;  --bad-ink:#f08a72;
    --cat0-bg:#3a2740; --cat0-ink:#e3b8ea;
    --cat1-bg:#29304f; --cat1-ink:#b9c2f2;
    --cat2-bg:#1f3540; --cat2-ink:#8fd0ef;
    --cat3-bg:#423318; --cat3-ink:#e0bd6a;
    --cat4-bg:#402626; --cat4-ink:#eb9a9f;
    --cat5-bg:#2a333c; --cat5-ink:#b6c4d1;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    padding:0 20px;
    padding-block:28px 64px;
  }
  @media (min-width:720px){ body{ padding-inline:40px; } }

  .wrap{ max-width:1160px; margin:0 auto; }

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-photo{
    width:56px; height:56px; border-radius:50%;
    object-fit:cover; border:2px solid var(--border);
    box-shadow:var(--shadow); flex-shrink:0;
  }
  .brand-text{ display:flex; flex-direction:column; gap:4px; }
  .brand h1{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.7rem,3vw,2.3rem);
    margin:0;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .brand .sub{
    font-family:var(--font-mono);
    font-size:.78rem;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .header-right{ display:flex; align-items:center; gap:12px; }
  #sync-note{
    font-family:var(--font-mono);
    font-size:.72rem;
    color:var(--ink-faint);
    text-align:right;
  }
  #sync-note.warn{ color:var(--warn-ink); }

  .stats{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-bottom:28px;
  }
  .stat{
    flex:1 1 130px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 16px;
    box-shadow:var(--shadow);
  }
  .stat .n{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-size:1.6rem;
    font-weight:600;
    line-height:1.1;
  }
  .stat .l{
    font-size:.72rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-top:4px;
  }
  .stat.good .n{ color:var(--good-ink); }
  .stat.warn .n{ color:var(--warn-ink); }
  .stat.bad .n{ color:var(--bad-ink); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px,1fr));
    gap:14px;
  }

  .card{
    text-align:left;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px 14px;
    box-shadow:var(--shadow);
    cursor:pointer;
    font:inherit;
    color:inherit;
    display:flex; flex-direction:column; gap:10px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .card.card-enter{ opacity:0; transform:translateY(6px); animation:rise .4s ease forwards; }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion:reduce){
    .card.card-enter{ animation:none; opacity:1; transform:none; }
  }

  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .chip{
    font-family:var(--font-mono);
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:3px 9px;
    border-radius:100px;
    white-space:nowrap;
  }
  .pill{
    font-family:var(--font-mono);
    font-size:.68rem;
    font-weight:600;
    padding:3px 9px;
    border-radius:100px;
    white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
  }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.on-track{ background:var(--good-bg); color:var(--good-ink); }
  .pill.at-risk{ background:var(--warn-bg); color:var(--warn-ink); }
  .pill.blocked{ background:var(--bad-bg); color:var(--bad-ink); }

  .card h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.2rem;
    margin:0;
    text-wrap:balance;
  }
  .card .stage{
    font-size:.78rem;
    color:var(--ink-soft);
    margin-top:-6px;
  }
  .card p.summary{
    margin:0;
    font-size:.86rem;
    color:var(--ink-soft);
    line-height:1.45;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .meter{ display:flex; flex-direction:column; gap:4px; }
  .meter-track{
    height:7px; border-radius:100px; background:var(--surface-2);
    overflow:hidden; border:1px solid var(--border);
  }
  .meter-fill{ height:100%; border-radius:100px; }
  .meter-fill.on-track{ background:var(--good-ink); }
  .meter-fill.at-risk{ background:var(--warn-ink); }
  .meter-fill.blocked{ background:var(--bad-ink); }
  .meter-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .meter-row .pct{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:.78rem; font-weight:600; }

  .card-foot{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-size:.74rem; color:var(--ink-faint);
    padding-top:8px; margin-top:2px;
    border-top:1px solid var(--border);
  }
  .card-foot .milestone{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-foot .meta{ font-family:var(--font-mono); white-space:nowrap; flex-shrink:0; }

  .card-meta{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .avatars{ display:flex; gap:4px; flex-wrap:wrap; }
  .avatar{
    width:22px; height:22px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:.62rem; font-weight:600; color:var(--ink-soft);
  }
  .links{ display:flex; gap:6px; flex-wrap:wrap; }
  .link-chip{
    font-family:var(--font-mono); font-size:.68rem;
    color:var(--accent-ink); background:var(--accent-soft);
    padding:2px 8px; border-radius:100px; text-decoration:none;
  }
  .link-chip:hover{ text-decoration:underline; }
  .link-chip.plain{ cursor:default; color:var(--ink-soft); background:var(--surface-2); }
  .link-chip.plain:hover{ text-decoration:none; }

  /* panel */
  .backdrop{
    position:fixed; inset:0; background:rgba(15,14,10,.45);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:20;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  .panel{
    position:fixed; top:0; right:0; height:100%;
    width:min(440px,100%);
    background:var(--surface);
    border-left:1px solid var(--border);
    box-shadow:-16px 0 40px -20px rgba(0,0,0,.35);
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:21;
    display:flex; flex-direction:column;
  }
  .panel.open{ transform:translateX(0); }
  .panel-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:20px 20px 14px; border-bottom:1px solid var(--border);
  }
  .panel-head h2{ font-family:var(--font-display); font-weight:600; font-size:1.4rem; margin:2px 0 0; text-wrap:balance; }
  .panel-body{ padding:18px 20px 24px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:18px; }
  .close-btn{
    background:none; border:1px solid var(--border); color:var(--ink-soft);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:1rem; line-height:1;
    flex-shrink:0;
  }
  .close-btn:hover{ color:var(--ink); border-color:var(--ink-soft); }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  select, input[type=text], textarea{
    font-family:var(--font-ui); font-size:.9rem; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; width:100%;
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ resize:vertical; min-height:56px; font-family:var(--font-ui); line-height:1.4; }

  input[type=range]{ width:100%; accent-color:var(--accent); }
  .range-label{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.85rem; }
  .range-label b{ font-variant-numeric:tabular-nums; }

  .btn{
    font-family:var(--font-ui); font-weight:700; font-size:.84rem;
    border:none; border-radius:8px; padding:9px 16px; cursor:pointer;
    background:var(--accent); color:var(--bg);
  }
  .btn:hover{ filter:brightness(1.05); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--ink); }
  .save-row{ display:flex; justify-content:flex-end; gap:8px; }

  .section-head{ font-size:.9rem; margin:0; }
  .hint{ font-size:.72rem; color:var(--warn-ink); line-height:1.4; }

  .log h3{ font-size:.9rem; margin:0 0 10px; }
  .log-add{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .log-list{ display:flex; flex-direction:column; gap:12px; max-height:280px; overflow-y:auto; padding-right:2px; }
  .log-entry{ border-left:2px solid var(--border); padding-left:10px; }
  .log-entry .date{ font-family:var(--font-mono); font-size:.7rem; color:var(--ink-faint); }
  .log-entry .note{ font-size:.85rem; margin-top:2px; line-height:1.4; }

  .save-status{ font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint); align-self:center; margin-right:auto; }

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
    font-family:var(--font-mono); font-size:.85rem;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="brand-photo" src="assets/photo-1.png" alt="Prakhar">
      <div class="brand-text">
        <h1>Prakhar Bridge Board</h1>
        <div class="sub">Portfolio of 6 · live status</div>
      </div>
    </div>
    <div class="header-right">
      <a class="link-chip" href="terminal.html">Terminal</a>
      <div id="sync-note">connecting…</div>
    </div>
  </header>

  <div class="stats" id="stats" hidden></div>

  <main class="grid" id="grid" aria-live="polite">
    <div class="empty">Loading ventures…</div>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel-head">
    <div>
      <span class="chip" id="p-chip"></span>
      <h2 id="panel-title"></h2>
    </div>
    <button class="close-btn" id="p-close" aria-label="Close">✕</button>
  </div>
  <div class="panel-body">
    <div class="field">
      <label for="p-summary">One-liner</label>
      <textarea id="p-summary" rows="2"></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label for="p-stage">Stage</label>
        <select id="p-stage">
          <option>Ideation</option>
          <option>Building</option>
          <option>Testing</option>
          <option>Launched</option>
          <option>Paused</option>
        </select>
      </div>
      <div class="field">
        <label for="p-health">Health</label>
        <select id="p-health">
          <option value="on-track">On track</option>
          <option value="at-risk">At risk</option>
          <option value="blocked">Blocked</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="p-progress">Progress</label>
      <input type="range" id="p-progress" min="0" max="100" step="5">
      <div class="range-label"><span>Complete</span><b id="p-progress-val">0%</b></div>
    </div>
    <div class="field">
      <label for="p-milestone">Next milestone</label>
      <input type="text" id="p-milestone">
    </div>

    <h3 class="section-head">Team &amp; access</h3>
    <div class="field">
      <label for="p-team">Team members</label>
      <input type="text" id="p-team" placeholder="Comma-separated, e.g. Prakhar, Asha">
    </div>
    <div class="field">
      <label for="p-github">GitHub repo</label>
      <input type="text" id="p-github" placeholder="https://github.com/…">
    </div>
    <div class="field">
      <label for="p-live">Live platform</label>
      <input type="text" id="p-live" placeholder="https://…">
    </div>
    <div class="field">
      <label for="p-server">Server / infra link</label>
      <input type="text" id="p-server" placeholder="https://… or host / connection string">
    </div>
    <div class="field">
      <label for="p-ppt">Deck link</label>
      <input type="text" id="p-ppt" placeholder="https://docs.google.com/presentation/…">
    </div>
    <div class="field">
      <label for="p-creds">Credentials</label>
      <textarea id="p-creds" rows="2" placeholder="Where to find access, e.g. 1Password → Yumesorai vault"></textarea>
      <div class="hint">Stored in plain text in the local database file — store a pointer to where the credential lives, never the actual password, key, or token.</div>
    </div>

    <div class="save-row">
      <span class="save-status" id="p-save-status"></span>
      <button class="btn" id="p-save">Save changes</button>
    </div>

    <div class="log">
      <h3>Update log</h3>
      <div class="log-add">
        <textarea id="p-log-input" rows="2" placeholder="What happened since the last update?"></textarea>
        <div class="save-row"><button class="btn ghost" id="p-log-add">Log update</button></div>
      </div>
      <div class="log-list" id="p-log-list"></div>
    </div>
  </div>
</aside>

<script>
(function(){
  var CATS = {
    "yumesorai":0, "agent-arena":1, "new-age-browser":2,
    "gold-tokenization":3, "anime-micro-drama":4, "agentic-os":5
  };
  var HEALTH_LABEL = { "on-track":"On track", "at-risk":"At risk", "blocked":"Blocked" };
  var API = "/api/projects";
  var POLL_MS = 15000;

  var state = { docs: [], byId: {} };
  var els = {
    grid: document.getElementById('grid'),
    stats: document.getElementById('stats'),
    syncNote: document.getElementById('sync-note'),
    backdrop: document.getElementById('backdrop'),
    panel: document.getElementById('panel'),
    pChip: document.getElementById('p-chip'),
    pTitle: document.getElementById('panel-title'),
    pSummary: document.getElementById('p-summary'),
    pStage: document.getElementById('p-stage'),
    pHealth: document.getElementById('p-health'),
    pProgress: document.getElementById('p-progress'),
    pProgressVal: document.getElementById('p-progress-val'),
    pMilestone: document.getElementById('p-milestone'),
    pTeam: document.getElementById('p-team'),
    pGithub: document.getElementById('p-github'),
    pLive: document.getElementById('p-live'),
    pServer: document.getElementById('p-server'),
    pPpt: document.getElementById('p-ppt'),
    pCreds: document.getElementById('p-creds'),
    pSave: document.getElementById('p-save'),
    pSaveStatus: document.getElementById('p-save-status'),
    pLogInput: document.getElementById('p-log-input'),
    pLogAdd: document.getElementById('p-log-add'),
    pLogList: document.getElementById('p-log-list'),
    pClose: document.getElementById('p-close')
  };
  var openId = null;

  function fmtDate(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
    }catch(e){ return iso; }
  }

  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s == null ? '' : s;
    return div.innerHTML;
  }

  function initials(name){
    var parts = name.trim().split(/\s+/).filter(Boolean);
    return parts.slice(0,2).map(function(w){ return w[0].toUpperCase(); }).join('');
  }

  function ensureUrl(v){
    return /^https?:\/\//i.test(v) ? v : 'https://' + v;
  }

  function isUrlish(v){
    return /^(https?:\/\/|www\.)/i.test((v||'').trim());
  }

  function linkChip(label, value){
    if(!value) return '';
    var v = value.trim();
    if(isUrlish(v)){
      return '<a href="'+escapeHtml(ensureUrl(v))+'" target="_blank" rel="noopener" class="link-chip">'+label+' ↗</a>';
    }
    return '<span class="link-chip plain" title="'+escapeHtml(v)+'">'+label+'</span>';
  }

  function renderStats(){
    var docs = state.docs;
    if(!docs.length){ els.stats.hidden = true; return; }
    var avg = Math.round(docs.reduce(function(s,d){return s+(d.progress||0);},0)/docs.length);
    var onTrack = docs.filter(function(d){return d.health==='on-track';}).length;
    var atRisk = docs.filter(function(d){return d.health==='at-risk';}).length;
    var blocked = docs.filter(function(d){return d.health==='blocked';}).length;
    els.stats.hidden = false;
    els.stats.innerHTML =
      '<div class="stat"><div class="n">'+docs.length+'</div><div class="l">Ventures</div></div>' +
      '<div class="stat"><div class="n">'+avg+'%</div><div class="l">Avg. progress</div></div>' +
      '<div class="stat good"><div class="n">'+onTrack+'</div><div class="l">On track</div></div>' +
      '<div class="stat warn"><div class="n">'+atRisk+'</div><div class="l">At risk</div></div>' +
      '<div class="stat bad"><div class="n">'+blocked+'</div><div class="l">Blocked</div></div>';
  }

  function cardHtml(d, animate){
    var cat = CATS[d.id] || 0;
    var team = d.team || [];
    var avatars = team.map(function(name){
      return '<span class="avatar" title="'+escapeHtml(name)+'">'+escapeHtml(initials(name))+'</span>';
    }).join('');
    var links = [linkChip('GitHub', d.githubUrl), linkChip('Live', d.liveUrl), linkChip('Server', d.serverUrl), linkChip('Deck', d.pptUrl)].join('');
    var metaRow = (avatars || links)
      ? '<div class="card-meta"><div class="avatars">'+avatars+'</div><div class="links">'+links+'</div></div>'
      : '';
    var cls = animate ? 'card card-enter' : 'card';
    var style = animate ? ' style="animation-delay:'+(cat*40)+'ms"' : '';
    return (
      '<div class="'+cls+'" role="button" tabindex="0" data-id="'+d.id+'"'+style+'>'+
        '<div class="card-top">'+
          '<span class="chip" style="background:var(--cat'+cat+'-bg);color:var(--cat'+cat+'-ink)">'+escapeHtml(d.category)+'</span>'+
          '<span class="pill '+d.health+'">'+HEALTH_LABEL[d.health]+'</span>'+
        '</div>'+
        '<div>'+
          '<h2>'+escapeHtml(d.name)+'</h2>'+
          '<div class="stage">'+escapeHtml(d.stage)+'</div>'+
        '</div>'+
        '<p class="summary">'+escapeHtml(d.summary)+'</p>'+
        metaRow+
        '<div class="meter">'+
          '<div class="meter-track"><div class="meter-fill '+d.health+'" style="width:'+d.progress+'%"></div></div>'+
          '<div class="meter-row"><span></span><span class="pct">'+d.progress+'%</span></div>'+
        '</div>'+
        '<div class="card-foot">'+
          '<span class="milestone">→ '+escapeHtml(d.milestone)+'</span>'+
          '<span class="meta">'+fmtDate(d.updatedAt)+'</span>'+
        '</div>'+
      '</div>'
    );
  }

  function renderGrid(animate){
    if(!state.docs.length){
      els.grid.innerHTML = '<div class="empty">No ventures yet.</div>';
      return;
    }
    els.grid.innerHTML = state.docs.map(function(d){ return cardHtml(d, animate); }).join('');
  }

  function renderLog(d){
    var log = d.log || [];
    if(!log.length){
      els.pLogList.innerHTML = '<div class="save-status">No updates logged yet.</div>';
      return;
    }
    els.pLogList.innerHTML = log.map(function(e){
      return '<div class="log-entry"><div class="date">'+fmtDate(e.date)+'</div><div class="note">'+escapeHtml(e.note)+'</div></div>';
    }).join('');
  }

  function setState(docs, animate){
    state.docs = docs;
    state.byId = {};
    docs.forEach(function(d){ state.byId[d.id] = d; });
    renderStats();
    renderGrid(animate);
    if(openId && state.byId[openId]) renderLog(state.byId[openId]);
  }

  function openPanel(id){
    var d = state.byId[id];
    if(!d) return;
    openId = id;
    var cat = CATS[id] || 0;
    els.pChip.textContent = d.category;
    els.pChip.style.background = 'var(--cat'+cat+'-bg)';
    els.pChip.style.color = 'var(--cat'+cat+'-ink)';
    els.pTitle.textContent = d.name;
    els.pSummary.value = d.summary || '';
    els.pStage.value = d.stage || 'Ideation';
    els.pHealth.value = d.health || 'on-track';
    els.pProgress.value = d.progress || 0;
    els.pProgressVal.textContent = (d.progress||0)+'%';
    els.pMilestone.value = d.milestone || '';
    els.pTeam.value = (d.team || []).join(', ');
    els.pGithub.value = d.githubUrl || '';
    els.pLive.value = d.liveUrl || '';
    els.pServer.value = d.serverUrl || '';
    els.pPpt.value = d.pptUrl || '';
    els.pCreds.value = d.credentialsNote || '';
    els.pLogInput.value = '';
    els.pSaveStatus.textContent = '';
    renderLog(d);
    els.backdrop.classList.add('open');
    els.panel.classList.add('open');
    document.addEventListener('keydown', onKeydown);
  }

  function closePanel(){
    openId = null;
    els.backdrop.classList.remove('open');
    els.panel.classList.remove('open');
    document.removeEventListener('keydown', onKeydown);
  }

  function onKeydown(e){ if(e.key === 'Escape') closePanel(); }

  els.pProgress.addEventListener('input', function(){
    els.pProgressVal.textContent = els.pProgress.value + '%';
  });
  els.backdrop.addEventListener('click', closePanel);
  els.pClose.addEventListener('click', closePanel);
  els.grid.addEventListener('click', function(e){
    if(e.target.closest('a')) return;
    var card = e.target.closest('.card');
    if(card) openPanel(card.dataset.id);
  });
  els.grid.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest('.card');
    if(card){ e.preventDefault(); openPanel(card.dataset.id); }
  });

  els.pSave.addEventListener('click', function(){
    if(!openId) return;
    els.pSave.disabled = true;
    els.pSaveStatus.textContent = 'saving…';
    fetch(API + '/' + openId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        summary: els.pSummary.value.trim(),
        stage: els.pStage.value,
        health: els.pHealth.value,
        progress: Number(els.pProgress.value),
        milestone: els.pMilestone.value.trim(),
        team: els.pTeam.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean),
        githubUrl: els.pGithub.value.trim(),
        liveUrl: els.pLive.value.trim(),
        serverUrl: els.pServer.value.trim(),
        pptUrl: els.pPpt.value.trim(),
        credentialsNote: els.pCreds.value.trim()
      })
    }).then(function(res){
      if(!res.ok) throw new Error('save failed');
      return res.json();
    }).then(function(updated){
      state.byId[updated.id] = updated;
      state.docs = state.docs.map(function(d){ return d.id === updated.id ? updated : d; });
      renderStats();
      renderGrid();
      els.pSaveStatus.textContent = 'saved';
      els.pSave.disabled = false;
    }).catch(function(){
      els.pSaveStatus.textContent = 'save failed — try again';
      els.pSave.disabled = false;
    });
  });

  els.pLogAdd.addEventListener('click', function(){
    if(!openId) return;
    var note = els.pLogInput.value.trim();
    if(!note) return;
    els.pLogAdd.disabled = true;
    fetch(API + '/' + openId + '/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ note: note })
    }).then(function(res){
      if(!res.ok) throw new Error('log failed');
      return res.json();
    }).then(function(updated){
      state.byId[updated.id] = updated;
      state.docs = state.docs.map(function(d){ return d.id === updated.id ? updated : d; });
      renderGrid();
      renderLog(updated);
      els.pLogInput.value = '';
      els.pLogAdd.disabled = false;
    }).catch(function(){
      els.pLogAdd.disabled = false;
      els.pSaveStatus.textContent = 'log save failed';
    });
  });

  var firstLoad = true;
  function load(){
    return fetch(API).then(function(res){
      if(!res.ok) throw new Error('load failed');
      return res.json();
    }).then(function(docs){
      setState(docs, firstLoad);
      firstLoad = false;
      els.syncNote.textContent = 'synced · ' + new Date().toLocaleTimeString();
      els.syncNote.classList.remove('warn');
    }).catch(function(){
      els.syncNote.textContent = 'backend unreachable';
      els.syncNote.classList.add('warn');
      if(!state.docs.length){
        els.grid.innerHTML = '<div class="empty">Could not reach the Prakhar Bridge Board API. Is the backend running?</div>';
      }
    });
  }

  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
